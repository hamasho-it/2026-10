<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポイントを使う - ごみカツ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="./home_volunteer.html" class="back-btn">戻る</a>
            <h1>ポイントを使う</h1>
        </header>
        <main>
            <div class="card" style="text-align: center; background: #eee;">
                <p style="font-size: 1rem;">現在のポイント：<strong>1,200 pt</strong></p>
            </div>

            <div class="card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="img-placeholder square">
                        <img src="./images/img_coupon1.png" alt="商品券">
                    </div>
                    <div style="flex: 1;">
                        <p style="font-weight: bold;">サンプル商店街 共通商品券 500円分</p>
                        <p style="font-size: 0.9rem; color: #666;">必要: 500 pt</p>
                    </div>
                </div>
                <a href="./point_complete.html" class="btn" style="padding: 10px; font-size: 1rem; margin-top: 6px;">交換する</a>
            </div>

            <div class="card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="img-placeholder square">
                        <img src="./images/img_coupon2.png" alt="カフェ券">
                    </div>
                    <div style="flex: 1;">
                        <p style="font-weight: bold;">サンプルカフェ 割引チケット</p>
                        <p style="font-size: 0.9rem; color: #666;">必要: 300 pt</p>
                    </div>
                </div>
                <a href="./point_complete.html" class="btn" style="padding: 10px; font-size: 1rem; margin-top: 6px;">交換する</a>
            </div>

            <div class="card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="img-placeholder square">
                        <img src="./images/img_coupon1.png" alt="薬局券">
                    </div>
                    <div style="flex: 1;">
                        <p style="font-weight: bold;">サンプル薬局 お買い物券 1,000円分</p>
                        <p style="font-size: 0.9rem; color: #666;">必要: 1,000 pt</p>
                    </div>
                </div>
                <a href="./point_complete.html" class="btn" style="padding: 10px; font-size: 1rem; margin-top: 6px;">交換する</a>
            </div>
        </main>
        <footer>© ごみカツ！</footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
