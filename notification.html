<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知履歴 - ごみカツ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="./home_requester.html" class="back-btn">戻る</a>
            <h1>通知履歴</h1>
        </header>
        <main>
            <div class="tab-container">
                <button class="tab active">すべて</button>
                <button class="tab">ごみの日</button>
                <button class="tab">ごみ出し</button>
            </div>

            <div class="card">
                <span class="tag">ボランティアからの返答</span>
                <p style="font-weight: bold; margin-top: 4px;">ボランティア1さんが「対応できます」と返答しました。</p>
                <span style="font-size: 0.8rem; color: #888;">本日 08:30</span>
            </div>

            <div class="card">
                <span class="tag">マッチング成立</span>
                <p style="font-weight: bold; margin-top: 4px;">11月10日（火）のゴミ出し支援が確定しました。</p>
                <span style="font-size: 0.8rem; color: #888;">本日 08:31</span>
            </div>

            <div class="card">
                <span class="tag">ゴミの日お知らせ</span>
                <p style="font-weight: bold; margin-top: 4px;">明日は「燃えるごみ」の日です。</p>
                <span style="font-size: 0.8rem; color: #888;">昨日 18:00</span>
            </div>

            <div class="card">
                <span class="tag">支援完了</span>
                <p style="font-weight: bold; margin-top: 4px;">前回のゴミ出し支援が正常に完了しました。</p>
                <span style="font-size: 0.8rem; color: #888;">11月3日</span>
            </div>
        </main>
        <footer>© ごみカツ！</footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
