<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム画面（ボランティア用） - ごみカツ！</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <a href="./index.html" class="back-btn">戻る</a>
            <h1>ボランティア ホーム</h1>
        </header>
        <main>
            <div class="profile-section">
                <div class="img-placeholder">
                    <img src="./images/icon_volunteer1.png" alt="ボランティア">
                </div>
                <div>
                    <h2>プロフィール</h2>
                    <p style="font-size: 1.1rem; font-weight: bold;">ボランティア1 様</p>
                </div>
            </div>

            <div class="card" style="background-color: #eee; text-align: center; padding: 20px;">
                <p style="font-size: 1rem; color: #555;">現在のポイント</p>
                <p style="font-size: 2.2rem; font-weight: bold; color: #222;">1,200 <span style="font-size: 1.2rem;">pt</span></p>
                <a href="./point_use.html" class="btn" style="margin-top: 10px; padding: 12px;">ポイントを使う</a>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <a href="./new_requests.html" class="btn btn-secondary">新しい支援依頼</a>
                <a href="./scheduled_requests.html" class="btn btn-secondary">対応予定の支援依頼</a>
                <a href="./history_volunteer.html" class="btn btn-light">支援履歴</a>
            </div>
        </main>
        <footer>© ごみカツ！</footer>
    </div>
    <script src="./script.js"></script>
</body>
</html>
