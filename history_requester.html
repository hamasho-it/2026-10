<!DOCTYPE html>

                    <span class="tag">完了</span>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <p style="font-weight: bold; font-size: 1.1rem;">ごみ3：燃えないごみ</p>
                    <span class="tag">完了</span>

                <p style="font-size: 0.9rem; color: #555;">日時：2026年10月14日（水） 07:30</p>
